version: 2

before:
  hooks:
    - go mod tidy
    - go get -u github.com/sinspired/subs-check-pro-webui
    - env GOBIN=/usr/local/bin go install github.com/tc-hib/go-winres@latest
    - go generate ./...

release:
  # 自动检测是否为预发布版本 (如 v2.5.0-rc.1 会自动标记为 Pre-release)
  prerelease: auto

  # 底部说明模板
  footer: |
    ---
    ![GitHub Downloads (all assets, specific tag)](https://img.shields.io/github/downloads/sinspired/subs-check-pro/{{ .Tag }}/total?style=flat&logo=github&label=当前版本下载次数&labelColor=black&color=0ea5a0)

    - 🧪 v{{.Major}} 移除 Node，支持 Android，大幅压缩体积，欢迎测试！
    - 💡 **变更日志**: [{{ .PreviousTag }}...{{ .Tag }}]({{ .GitURL }}/compare/{{ .PreviousTag }}...{{ .Tag }})
    - 🐳 Docker 镜像 `docker pull sinspired/subs-check-pro:{{ .Version }}`
    - 💬 反馈方式
      - 👥 Telegram 群组：[subs-check性能版](https://t.me/subs_check_pro)
      - 📣 Telegram 频道：[关注频道](https://t.me/sinspired_ai)

# 变更日志配置
changelog:
  sort: desc
  use: github
  # 过滤掉不需要显示在日志中的提交
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^style:'
      - '^Merge pull request'
      - '^Merge branch'
      - 'go mod tidy'
      - "^(?i)chore\\(doc\\):" # 过滤单纯的 README 调整

  format: '{{ .SHA }}: {{ .Message }}'
  # 提交分组配置
  groups:
    - title: '✨ 新功能'
      # 匹配 feat: 或 feat(scope): 且不区分大小写
      regexp: "^(?i)feat(\\([\\w-]+\\))?:+.*$"
      order: 0
    - title: '🐛 Bug 修复'
      # 匹配 fix: 或 fix(scope): 且不区分大小写
      regexp: "^(?i)fix(\\([\\w-]+\\))?:+.*$"
      order: 1
    - title: '🚀 性能优化'
      # 匹配 perf: 或 perf(scope): 且不区分大小写
      regexp: "^(?i)perf(\\([\\w-]+\\))?:+.*$"
      order: 2
    - title: '🔧 重构维护'
      # 匹配 refactor/chore/build/ci 及其带作用域的形式
      regexp: "^(?i)(chore|refactor|build|ci)(\\([\\w-]+\\))?:+.*$"
      order: 3
    - title: '📝 文档更新'
      regexp: "^(?i)docs(\\([\\w-]+\\))?:+.*$"
      order: 4
    - title: '📦 其他'
      order: 999

# 构建配置
builds:
  # 1. Linux 构建组 (使用 musl 进行静态链接)
  - id: subs-check-pro-linux
    binary: subs-check-pro
    env:
      - CGO_ENABLED=1
      # 使用镜像内置的 Linux GNU 编译器
      - CC={{ if eq .Arch "amd64" }}x86_64-linux-gnu-gcc{{ else if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}arm-linux-gnueabihf-gcc{{ end }}
      - CXX={{ if eq .Arch "amd64" }}x86_64-linux-gnu-g++{{ else if eq .Arch "arm64" }}aarch64-linux-gnu-g++{{ else }}arm-linux-gnueabihf-g++{{ end }}
    targets:
      # Desktop / Server
      - linux_amd64
      - linux_arm64
      - linux_arm_7
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
      # 添加 tags 强制 Go 使用内置 DNS 解析，防止在没有 glibc 的系统上 DNS 解析失败
      - -tags=netgo,osusergo
    ldflags:
      - -s -w -extldflags "-static -Wl,-z,stack-size=8388608" -X main.Version={{ .Version }} -X main.CurrentCommit={{ .ShortCommit }}

  # 2. Windows 构建组 (使用 gnu 兼容层)
  - id: subs-check-pro-windows
    binary: subs-check-pro
    env:
      - CGO_ENABLED=1
      # 使用镜像内置的 MinGW 编译器
      - CC={{ if eq .Arch "amd64" }}x86_64-w64-mingw32-gcc{{ else if eq .Arch "arm64" }}/llvm-mingw/bin/aarch64-w64-mingw32-gcc{{ else }}i686-w64-mingw32-gcc{{ end }}
      - CXX={{ if eq .Arch "amd64" }}x86_64-w64-mingw32-g++{{ else if eq .Arch "arm64" }}/llvm-mingw/bin/aarch64-w64-mingw32-g++{{ else }}i686-w64-mingw32-g++{{ end }}
    targets:
      - windows_amd64
      - windows_arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      # 切断对 Windows C 运行库的依赖
      - -s -w -extldflags "-static" -X main.Version={{ .Version }} -X main.CurrentCommit={{ .ShortCommit }}

  # 3. macOS 构建组
  - id: subs-check-pro-darwin
    binary: subs-check-pro
    env:
      - CGO_ENABLED=1
      # 使用 OSXCross (苹果跨平台编译器)，镜像内自带了 Apple SDK
      - CC={{ if eq .Arch "amd64" }}o64-clang{{ else }}oa64-clang{{ end }}
      - CXX={{ if eq .Arch "amd64" }}o64-clang++{{ else }}oa64-clang++{{ end }}
    targets:
      - darwin_amd64
      - darwin_arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      # macOS 苹果禁止静态链接，不能加 -extldflags "-static"
      - -s -w -X main.Version={{ .Version }} -X main.CurrentCommit={{ .ShortCommit }}

# 归档配置
archives:
  - ids:
      - subs-check-pro-linux
      - subs-check-pro-windows
      - subs-check-pro-darwin
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv7
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: zip

# Docker 镜像多架构自动打包与分发
dockers_v2:
  - id: subs-check-pro
    # 明确告诉 Docker 构建只取用 Linux 系列的产物
    ids: [subs-check-pro-linux]
    # 使用专用 Dockerfile 文件
    dockerfile: Dockerfile.goreleaser
    # 同时发布到 GitHub Container Registry 和 Docker Hub
    images:
      - 'ghcr.io/{{ .Env.GITHUB_REPOSITORY }}'
      - '{{ .Env.DOCKERHUB_USERNAME }}/subs-check-pro'

    # 自动发布 latest 和 版本号
    tags:
      - '{{ .Version }}'
      - '{{ if eq .Prerelease "" }}latest{{ end }}'

    # docker buildx 的平台列表
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7

    # OCI 镜像规范标签
    annotations:
      'org.opencontainers.image.title': 'subs-check-pro'
      'org.opencontainers.image.description': '高性能代理检测筛选工具，支持高并发测活、测速、媒体检测'
      'org.opencontainers.image.created': '{{.Date}}'
      'org.opencontainers.image.name': '{{.ProjectName}}'
      'org.opencontainers.image.revision': '{{ .FullCommit }}'
      'org.opencontainers.image.version': '{{ .Version }}'
      'org.opencontainers.image.source': '{{.GitURL}}'
      'org.opencontainers.image.base.name': '{{.BaseImage}}'
      'org.opencontainers.image.base.digest': '{{.BaseImageDigest}}'
    # 正式版本创建物料清单 (SBOM)，预发布版本跳过
    sbom: '{{ eq .Prerelease "" }}'

# 压缩可执行文件
upx:
  - ids: [subs-check-pro-linux]
    enabled: true
    goos: [linux]
    goarch: [amd64, arm64, arm]
    compress: best

  - ids: [subs-check-pro-windows]
    enabled: true
    goos: [windows]
    goarch: [amd64]
    compress: best
